name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate token schema
        run: npx --yes ajv-cli@5 validate --spec=draft2020 -s tokens.schema.json -d tokens.json
      - name: Check
        run: pnpm check
      - name: Test
        run: pnpm test
      - name: Build generated files
        run: pnpm build
