name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node_version: [22, 24, 26]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - name: Set git to use LF
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - uses: actions/checkout@v7

      - uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true
          runtime: node@${{ matrix.node_version }}

      - name: Validate token schema
        run: npx --yes ajv-cli@5 validate --spec=draft2020 -s tokens.schema.json -d tokens.json

      - name: Build generated files
        run: pnpm build

      - name: Check
        run: pnpm check

      - name: Test
        run: pnpm test
